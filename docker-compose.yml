# Herbario completo: Postgres + back + front.
# Requiere las dos carpetas lado a lado (back_herbario2 y front_herbario2).
#
#   cp .env.docker.example .env.docker   # y completa los secretos
#   docker compose up -d --build                    # las migraciones se aplican al arrancar
#   docker compose exec back npm run create-admin   # primer administrador (pregunta los datos)
#   Luego, en el panel: Correo (obligatorio para registro y recuperar contraseña).
#
# Solo para demos/pruebas (BORRA TODO y crea usuarios con contraseñas conocidas):
#   docker compose exec back npm run prisma:seed -- --reset
#
# Front: http://localhost:3000 · API: http://localhost:4000/api/v1 · Swagger: /api/docs
#
# Variables del compose (archivo .env junto a este, o en la consola):
#   POSTGRES_PASSWORD   contraseña de la base (cámbiala en producción)
#   PLATFORM_DOMAIN     dominio de la plataforma: cada herbario en <slug>.PLATFORM_DOMAIN (front)
#   PUBLIC_API_URL      vacío (recomendado): el front llama a /api en su mismo dominio
#   BACK_PUBLISH / FRONT_PUBLISH   puerto publicado; detrás de nginx: 127.0.0.1:4100 / 127.0.0.1:3100
#   (Docker publica saltándose el firewall: con 127.0.0.1 solo nginx llega a ellos)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: herbario
      POSTGRES_USER: herbario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-herbario}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herbario -d herbario"]
      interval: 5s
      timeout: 5s
      retries: 10

  back:
    build: .
    # init: reenvía las señales de apagado (docker stop) para que Node cierre limpio y no a los 10 s
    init: true
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # Servidor/usuario de las bases de los herbarios (cada herbario tiene su base: herbario_<slug>)
      DATABASE_URL: postgresql://herbario:${POSTGRES_PASSWORD:-herbario}@db:5432/herbario?schema=public
      # Base de la plataforma: lista de herbarios (se crea sola al arrancar)
      MASTER_DATABASE_URL: postgresql://herbario:${POSTGRES_PASSWORD:-herbario}@db:5432/herbario_master?schema=public
      PORT: 4000
    ports:
      # Dónde se publica (en un servidor con nginx delante: BACK_PUBLISH=127.0.0.1:4100)
      - "${BACK_PUBLISH:-4000}:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  front:
    init: true
    build:
      context: ../front_herbario2
      args:
        # Multitenant: el navegador llama a /api en el mismo dominio (nginx o Next lo llevan al back)
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        BACKEND_URL: http://back:4000
        NEXT_PUBLIC_PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
    restart: unless-stopped
    ports:
      - "${FRONT_PUBLISH:-3000}:3000"
    depends_on:
      back:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
